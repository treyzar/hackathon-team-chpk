<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Образовательная платформа</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Токены — брендбук v1.1, раздел 08, без изменений */
:root{
  color-scheme: light;
  --brand-blue:#3457F0; --brand-blue-hover:#2641C9; --brand-blue-50:#EAF0FE; --brand-blue-200:#C9D5FC;
  --brand-sky:#7C95FF; --brand-night:#0B1220; --brand-night-2:#131C30;
  --brand-amber:#F07A2A; --brand-amber-text:#B8520F; --brand-amber-50:#FFF1E6;
  --brand-ink:#0F172A; --brand-ink-2:#4A546B; --brand-ink-3:#7C869C; --brand-line:#E1E6F0; --brand-mist:#F4F6FB; --brand-paper:#FFFFFF;
  --st-done:#17915A; --st-done-bg:#E4F5EC; --st-review:#6E4FE8; --st-review-bg:#EFEBFE;
  --st-returned:#B8520F; --st-returned-bg:#FFF1E6; --st-failed:#D23B3B; --st-failed-bg:#FCEBEB;
  --st-progress:#3457F0; --st-progress-bg:#EAF0FE; --st-idle:#5E677D; --st-idle-bg:#F0F2F6;
  --font:"Onest", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --font-mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-6:24px; --sp-8:32px; --sp-12:48px; --sp-16:64px;
  --r-field:8px; --r-btn:12px; --r-card:16px; --r-pill:999px;
  /* цвета категорий блоков — только для записи программ Scratch и MakeCode */
  --blk-events:#E6A800; --blk-motion:#4C97FF; --blk-control:#F29A0B; --blk-looks:#9966FF;
  --blk-pen:#0FA87D; --blk-sensing:#3FA4CF; --blk-vars:#F57E0B; --blk-other:#7C869C;
  --mc-player:#0078D7; --mc-agent:#D83B01; --mc-loops:#107C10; --mc-vars:#C2185B;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font);color:var(--brand-ink);background:var(--brand-mist);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand-blue);text-underline-offset:3px}
h1,h2,h3,h4{margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
.num,.tnum{font-variant-numeric:tabular-nums}
.mono{font-family:var(--font-mono)}
.muted{color:var(--brand-ink-2)}
.faint{color:var(--brand-ink-3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--brand-blue-200);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

.role-student{font-size:18px;line-height:1.6;--btn-h:56px;--r-btn:14px}
.role-staff{font-size:14px;line-height:1.5;--btn-h:40px}

/* Иконки: линейные 24 px, контур 1,8 */
.ic{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:16px;height:16px;stroke-width:2.2}
.ic.md{width:20px;height:20px}

/* Кнопки */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:var(--btn-h);padding:0 20px;border-radius:var(--r-btn);font-weight:600;border:1px solid transparent;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .15s,border-color .15s,color .15s;background:none}
.btn-primary{background:var(--brand-blue);color:#fff}
.btn-primary:hover{background:var(--brand-blue-hover)}
.btn-secondary{background:#fff;color:var(--brand-ink);border-color:var(--brand-line)}
.btn-secondary:hover{border-color:var(--brand-ink-3)}
.btn-ghost{color:var(--brand-blue);padding:0 10px}
.btn-ghost:hover{background:var(--brand-blue-50)}
.btn-return{background:#fff;color:var(--brand-amber-text);border-color:var(--brand-amber)}
.btn-return:hover{background:var(--brand-amber-50)}
.btn-danger{background:#fff;color:var(--st-failed);border-color:#F3C3C3}
.btn:disabled,.btn.is-off{background:var(--st-idle-bg);color:var(--brand-ink-3);border-color:transparent;cursor:not-allowed}
.btn-sm{min-height:32px;padding:0 12px;border-radius:8px;font-size:13px}
.role-student .btn-lg{font-size:20px;padding:0 28px}
.btn-block{width:100%}
.linkbtn{background:none;border:0;padding:0;color:var(--brand-blue);font-weight:600;cursor:pointer;text-decoration:none}
.linkbtn:hover{text-decoration:underline}

/* Поля */
.field{display:grid;gap:6px}
.field>span{font-weight:600;font-size:.86em}
.inp,.ta,.sel{width:100%;border:1px solid var(--brand-line);border-radius:var(--r-field);background:#fff;padding:8px 12px;min-height:40px}
.role-student .inp,.role-student .ta{min-height:56px;padding:14px 16px;border-radius:12px}
.ta{min-height:96px;resize:vertical;line-height:1.5}
.inp:focus,.ta:focus,.sel:focus{outline:none;border-color:var(--brand-blue);box-shadow:0 0 0 3px var(--brand-blue-50)}
.chk{display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.chk input{width:16px;height:16px;accent-color:var(--brand-blue)}

/* Карточки и общие блоки */
.card{background:var(--brand-paper);border:1px solid var(--brand-line);border-radius:var(--r-card)}
.pad{padding:24px}
.role-staff .pad{padding:20px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--brand-ink-3)}
.role-student .eyebrow{font-size:15px;letter-spacing:.06em}
.stack{display:grid;gap:16px}
.stack-lg{display:grid;gap:24px}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.note{background:var(--brand-blue-50);border:1px solid var(--brand-blue-200);border-radius:12px;padding:14px 18px}
.warn{background:var(--brand-amber-50);border:1px solid #F8C9A6;border-radius:12px;padding:14px 18px}
.divider{height:1px;background:var(--brand-line);border:0;margin:0}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:var(--r-pill);background:var(--st-idle-bg);color:var(--brand-ink-2);font-size:13px;font-weight:600;white-space:nowrap}
.role-student .chip{font-size:15px;padding:4px 12px}
.chip-blue{background:var(--brand-blue-50);color:var(--brand-blue)}
.chip-dark{background:rgba(255,255,255,.1);color:#fff}
.chip-ok{background:var(--st-done-bg);color:var(--st-done)}
.chip-warn{background:var(--brand-amber-50);color:var(--brand-amber-text)}
.subline{display:block;color:var(--brand-ink-3);font-size:13px}
.fb-ret .pill{background:#fff}
.btn:focus-within{outline:3px solid var(--brand-blue-200);outline-offset:2px}
code.mono{font-size:.9em;background:rgba(255,255,255,.6);padding:0 4px;border-radius:4px}

/* Статусы: цвет + иконка (раздел 03) */
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 8px;border-radius:var(--r-pill);font-weight:600;font-size:13px;white-space:nowrap;line-height:1.5}
.role-student .pill{font-size:15px;padding:4px 12px 4px 10px}
.st-done{color:var(--st-done);background:var(--st-done-bg)}
.st-review{color:var(--st-review);background:var(--st-review-bg)}
.st-returned{color:var(--st-returned);background:var(--st-returned-bg)}
.st-failed{color:var(--st-failed);background:var(--st-failed-bg)}
.st-progress{color:var(--st-progress);background:var(--st-progress-bg)}
.st-idle{color:var(--st-idle);background:var(--st-idle-bg)}
.pill-by{font-size:13px;color:var(--brand-ink-3)}
.role-student .pill-by{font-size:15px}
.lag{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:13px;white-space:nowrap}
.lag::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.lag-ok{color:var(--st-done)}
.lag-slow{color:var(--brand-amber-text)}
.lag-slow::before{background:var(--brand-amber)}
.lag-drop{color:var(--st-failed)}

/* Тип шага: иконка в синем квадрате (раздел 05) */
.tb{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:10px;background:var(--brand-blue-50);color:var(--brand-blue);flex:none}
.tb.s{width:32px;height:32px;border-radius:8px}
.tb.s .ic{width:18px;height:18px}

/* Полоса прогресса */
.bar{height:8px;border-radius:var(--r-pill);background:var(--brand-line);overflow:hidden}
.role-student .bar{height:10px}
.bar>i{display:block;height:100%;background:var(--brand-blue);border-radius:inherit}

/* Демо-панель прототипа */
.demo{background:var(--brand-night);color:#C8D0E0;font-size:13px;line-height:1.4;padding-block:8px;padding-inline:16px;display:flex;align-items:center;gap:8px 16px;flex-wrap:wrap}
.demo b{color:#fff;font-weight:600}
.demo .seg{display:inline-flex;background:var(--brand-night-2);border:1px solid #243049;border-radius:10px;padding:2px}
.demo .seg button{border:0;background:none;color:#C8D0E0;padding:5px 12px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13px}
.demo .seg button[aria-pressed="true"]{background:var(--brand-blue);color:#fff}
.demo select{background:var(--brand-night-2);color:#fff;border:1px solid #243049;border-radius:8px;padding:5px 8px;font-size:13px;max-width:100%}
.demo .reset{background:none;border:1px solid #243049;color:#C8D0E0;border-radius:8px;padding:5px 10px;cursor:pointer;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.demo .reset:hover{color:#fff;border-color:#3A4A6B}
.demo .dot{width:8px;height:8px;border-radius:50%;background:var(--brand-amber);display:inline-block}
.demo .sp{flex:1}

/* Верхняя панель продукта */
.top{background:#fff;border-bottom:1px solid var(--brand-line);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.top-in{display:flex;align-items:center;gap:16px;min-height:64px;padding-inline:24px;max-width:1240px;margin:0 auto}
.role-student .top-in{min-height:72px;max-width:1120px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--brand-ink);text-decoration:none;white-space:nowrap;font-size:16px;letter-spacing:-.01em;background:none;border:0;cursor:pointer;padding:0}
.brand .mk{width:30px;height:30px;border-radius:9px;background:var(--brand-night);position:relative;flex:none}
.brand .mk::after{content:"";position:absolute;right:6px;bottom:6px;width:8px;height:8px;border-radius:50%;background:var(--brand-blue)}
.brand .mk::before{content:"";position:absolute;left:7px;top:9px;width:9px;height:2.5px;border-radius:2px;background:#fff;box-shadow:0 5px 0 #fff}
.brand em{font-style:normal;color:var(--brand-blue)}
.snav{display:flex;gap:4px;flex:1;min-width:0;overflow-x:auto}
.snav button{border:0;background:none;padding:10px 16px;border-radius:12px;font-weight:600;color:var(--brand-ink-2);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:8px;font-size:17px}
.snav button[aria-current="page"]{background:var(--brand-blue-50);color:var(--brand-blue)}
.snav button:hover{color:var(--brand-ink)}
.badge{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--brand-blue);color:#fff;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.badge.amber{background:var(--brand-amber);color:var(--brand-night)}
.who{display:flex;align-items:center;gap:10px;white-space:nowrap}
.ava{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--brand-blue-50);color:var(--brand-blue);font-weight:700;font-size:14px;flex:none}
.who small{display:block;color:var(--brand-ink-3);font-size:13px;line-height:1.2}
.who b{display:block;font-size:15px;line-height:1.3}

/* Кабинет ученика */
.wrap{max-width:1120px;margin:0 auto;padding-inline:24px;padding-block:32px 64px}
.home{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:24px;align-items:start}
.next{position:relative;overflow:hidden;background:var(--brand-night);color:#fff;border-radius:20px;padding:32px 36px 36px;isolation:isolate}
.next::before{content:"";position:absolute;right:-18%;top:-55%;width:75%;height:160%;background:radial-gradient(closest-side,rgba(52,87,240,.62),rgba(52,87,240,0));z-index:-1}
.next .eyebrow{color:var(--brand-sky)}
.next h1{font-size:40px;line-height:1.1;font-weight:800;margin:12px 0 10px;max-width:16ch}
.next p{color:#C8D0E0;max-width:46ch}
.next .btn{margin-top:28px}
.next-done h1{max-width:22ch}
.ctitle{font-size:22px;font-weight:700;line-height:1.3}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.ccard{padding:22px 24px;display:grid;gap:12px;cursor:pointer;text-align:left;border:1px solid var(--brand-line);background:#fff;border-radius:var(--r-card);transition:border-color .15s}
.ccard:hover{border-color:var(--brand-blue-200)}
.ccard .meta{font-size:15px;color:var(--brand-ink-2)}
.ret{background:var(--brand-amber-50);border:1px solid #F8C9A6;border-radius:var(--r-card);padding:20px 22px;display:grid;gap:12px}
.ret .pill{background:#fff}
.ans{background:var(--brand-blue-50);border:1px solid var(--brand-blue-200);border-radius:var(--r-card);padding:20px 22px;display:grid;gap:10px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:40px 0 16px}
.sec-h h2{font-size:24px;font-weight:700}

/* Рейтинг с расшифровкой */
.rate{padding:24px;display:grid;gap:18px}
.rate-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.rate-big{font-size:52px;font-weight:800;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.rate-place{color:var(--brand-ink-2);font-size:16px}
.segbar{display:flex;gap:3px;height:14px}
.segbar i{display:block;height:100%;border-radius:4px;min-width:4px}
.rate-rows{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.rate-rows li{display:grid;grid-template-columns:14px 1fr auto;gap:10px;align-items:center;font-size:16px}
.rate-rows li i{width:12px;height:12px;border-radius:3px}
.rate-rows b{font-variant-numeric:tabular-nums;font-size:17px}
.rate-hint{font-size:16px;color:var(--brand-ink-2)}
.c-theory{background:var(--brand-blue-200)}
.c-auto{background:var(--brand-blue)}
.c-cur{background:var(--brand-sky)}
.c-streak{background:var(--brand-amber)}
details.how summary{cursor:pointer;color:var(--brand-blue);font-weight:600;font-size:16px;list-style:none}
details.how summary::-webkit-details-marker{display:none}
details.how[open] summary{margin-bottom:10px}
.how-list{font-size:15px;color:var(--brand-ink-2);display:grid;gap:4px;margin:0;padding-left:18px}

/* Карта курса */
.passport{display:flex;flex-wrap:wrap;gap:8px}
.map{display:grid;gap:16px}
.mod{padding:22px 24px 18px}
.mod h3{font-size:20px;font-weight:700;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.mod h3 small{font-size:15px;font-weight:500;color:var(--brand-ink-3)}
.chain{display:flex;align-items:flex-start;overflow-x:auto;padding:18px 4px 6px;scroll-snap-type:x proximity}
.node{flex:none;width:112px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;background:none;border:0;padding:0;cursor:pointer;scroll-snap-align:start;color:inherit}
.node .sq{width:56px;height:56px;border-radius:15px;display:grid;place-items:center;border:1.5px solid transparent;transition:transform .15s}
.node:hover .sq{transform:translateY(-2px)}
.node .lb{font-size:15px;line-height:1.3;color:var(--brand-ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:108px}
.node.n-done .sq{background:var(--st-done);color:#fff}
.node.n-review .sq{background:var(--st-review-bg);color:var(--st-review);border-color:var(--st-review)}
.node.n-returned .sq{background:var(--st-returned-bg);color:var(--st-returned);border-color:var(--brand-amber)}
.node.n-failed .sq{background:var(--st-failed-bg);color:var(--st-failed);border-color:var(--st-failed)}
.node.n-progress .sq{background:#fff;color:var(--brand-blue);border-color:var(--brand-blue)}
.node.n-current .sq{background:var(--brand-blue);color:#fff;border-color:var(--brand-blue);box-shadow:0 0 0 5px var(--brand-blue-200)}
.node.n-current .lb{color:var(--brand-blue);font-weight:700}
.node.n-idle{cursor:default}
.node.n-idle .sq{background:var(--st-idle-bg);color:var(--brand-ink-3)}
.lnk{flex:1 0 20px;height:2px;background:var(--brand-line);margin-top:28px;border-radius:2px}
.lnk.ok{background:var(--st-done)}
.legend{display:flex;flex-wrap:wrap;gap:8px}

/* Шаг */
.crumbs{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:16px;color:var(--brand-ink-2)}
.crumbs button{background:none;border:0;padding:0;color:var(--brand-blue);cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.steplay{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:32px;align-items:start;margin-top:20px}
.shead{display:grid;gap:14px}
.shead h1{font-size:36px;line-height:1.15;font-weight:800}
.passline{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:15px;color:var(--brand-ink-2)}
.passline b{color:var(--brand-ink);font-weight:600}
.body{display:grid;gap:16px;max-width:68ch}
.body h2{font-size:22px;font-weight:700;margin-top:10px}
.body ul{margin:0;padding-left:24px;display:grid;gap:6px}
.body .note{max-width:none}
.task{padding:24px;display:grid;gap:18px}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:14px;min-height:56px;padding:12px 18px;border:1.5px solid var(--brand-line);border-radius:14px;background:#fff;cursor:pointer;text-align:left;width:100%;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--brand-blue-200)}
.opt .mk2{width:24px;height:24px;border:2px solid var(--brand-ink-3);border-radius:50%;flex:none;display:grid;place-items:center;color:#fff}
.opt.multi .mk2{border-radius:7px}
.opt[aria-checked="true"]{border-color:var(--brand-blue);background:var(--brand-blue-50)}
.opt[aria-checked="true"] .mk2{border-color:var(--brand-blue);background:var(--brand-blue)}
.opt.ok{border-color:var(--st-done);background:var(--st-done-bg)}
.opt.ok .mk2{border-color:var(--st-done);background:var(--st-done)}
.opt:disabled{cursor:default}
.fb{border-radius:14px;padding:16px 20px;display:grid;gap:10px}
.fb-ok{background:var(--st-done-bg);color:#0F5C39}
.fb-no{background:var(--st-idle-bg);color:var(--brand-ink)}
.fb-fail{background:var(--st-failed-bg);color:#8E2323}
.fb-review{background:var(--st-review-bg);color:#3F2C99}
.fb-ret{background:var(--brand-amber-50);color:#6B2F08;border:1px solid #F8C9A6}
.fb b{color:inherit}
.side{display:grid;gap:16px;position:sticky;top:96px}
.mini{padding:18px 20px;display:grid;gap:12px}
.mini h3{font-size:17px;font-weight:700}
.mlist{display:grid;gap:2px;margin:0;padding:0;list-style:none}
.mlist button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:7px 8px;border-radius:10px;cursor:pointer;font-size:15px;line-height:1.35;color:var(--brand-ink)}
.mlist button:hover{background:var(--brand-mist)}
.mlist button[aria-current="step"]{background:var(--brand-blue-50);color:var(--brand-blue);font-weight:600}
.mlist button:disabled{color:var(--brand-ink-3);cursor:default;background:none}
.sdot{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;flex:none}
.sdot .ic{width:14px;height:14px;stroke-width:2.4}
.navrow{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:8px}
.qbox{display:grid;gap:12px}
.qa{border-top:1px solid var(--brand-line);padding-top:12px;display:grid;gap:8px;font-size:16px}
.qa .a{background:var(--brand-blue-50);border-radius:12px;padding:12px 14px}
.hist{display:grid;gap:8px}

## Из чего состоит окно Scratch
- **Сцена** — прямоугольник справа вверху. На ней происходит всё, что делает программа.

/* ===== Ядро: время, иконки, состояние ===== */
const MIN = 6e4, HOUR = 36e5, DAY = 864e5;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const plural = (n, a, b, c) => { const m10 = n % 10, m100 = n % 100; return (m10 === 1 && m100 !== 11) ? a : (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) ? b : c; };
const now = () => Date.now();
const startOfDay = ts => { const d = new Date(ts); d.setHours(0, 0, 0, 0); return d.getTime(); };
const dayKey = ts => { const d = new Date(ts); return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate(); };
const daysAgo = ts => Math.round((startOfDay(now()) - startOfDay(ts)) / DAY);

/* ===== Сохранение состояния в localStorage =====

const STORAGE_KEY = 'educational_platform_state_v1';
let saveTimer = null;

function storageSnapshot() {
  const copy = structuredClone(S);
  // ui содержит временные поля формы/фокуса/ошибок и не должен переживать F5.
  copy.ui = { sel: {}, num: {}, man: {}, fb: {}, run: {}, qd: {}, cmt: {}, crit: {} };

function saveStateNow() {
  if (!S) return;
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(storageSnapshot()));
  } catch (e) {
    // Например, браузер запретил storage или закончилось место.
    console.warn('Не удалось сохранить состояние в localStorage:', e);
  }
}

function saveState() {
  // Не пишем localStorage на каждый символ при редактировании полей.
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveStateNow, 100);
}

function clearSavedState() {
  clearTimeout(saveTimer);
  try { localStorage.removeItem(STORAGE_KEY); }
  catch (e) { console.warn('Не удалось очистить localStorage:', e); }
}

function loadSavedState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return false;

    const saved = JSON.parse(raw);
    if (!saved || typeof saved !== 'object' || !Array.isArray(saved.courses) || !Array.isArray(saved.users)) {
      clearSavedState();
      return false;
    }

    S = saved;
    S.ui = { sel: {}, num: {}, man: {}, fb: {}, run: {}, qd: {}, cmt: {}, crit: {} };
    return true;
  } catch (e) {
    console.warn('Не удалось загрузить состояние из localStorage:', e);
    clearSavedState();
    return false;
  }
}

/* ===== Производные: статусы шагов, прогресс, рейтинг, отставание ===== */
let memo = new Map();
const attsOf = (uid, sid) => S.atts.filter(a => a.uid === uid && a.sid === sid);
const subsOf = (uid, sid) => S.subs.filter(w => w.uid === uid && w.sid === sid);
function rawState(uid, step) {
  const kind = step.task.kind, mode = KINDS[kind]?.mode;
  if (mode === 'read') { const t = S.reads[uid]?.[step.id]; return t ? { st: 'done', by: 'read', at: t } : { st: 'progress' }; }
  if (mode === 'manual') {
    const list = subsOf(uid, step.id), last = list[list.length - 1];
    if (!last) return { st: 'progress' };
    return { st: last.st, by: last.st === 'done' ? 'curator' : null, at: last.rat || last.at, sub: last, n: list.length };
  }
  const list = attsOf(uid, step.id), ok = list.find(a => a.ok), last = list[list.length - 1];
  if (ok) return { st: 'done', by: kind === 'code' ? 'tests' : 'auto', at: ok.at, att: ok, n: list.length };
  if (last && kind === 'code') return { st: 'failed', att: last, n: list.length };

// Шаги открываются по порядку: следующий открыт, когда предыдущий зачтён или отправлен куратору.
function cs(uid, c) {
  const key = uid + '|' + c.id;
  if (memo.has(key)) return memo.get(key);
  let open = true, cur = false;
  const out = flat(c.data).map(x => {
    const r = rawState(uid, x.step);
    let st = r.st;
    if (!['done', 'review', 'returned'].includes(st) && !open) st = 'idle';
    const item = { ...x, ...r, st, current: false };
    if (!cur && (st === 'progress' || st === 'failed')) { item.current = true; cur = true; }
    open = ['done', 'review', 'returned'].includes(st);
    return item;
  });
  memo.set(key, out);
  return out;
}
const nextOf = (uid, c) => cs(uid, c).find(x => x.current) || null;
const groupFor = (uid, cid) => S.groups.find(g => g.courseId === cid && g.students.includes(uid));
const coursesOf = uid => S.courses.filter(c => c.status === 'published' && S.groups.some(g => g.courseId === c.id && g.students.includes(uid)));
const curatorOf = (uid, cid) => user(groupFor(uid, cid)?.curatorId);
function streakOf(uid) {
  const set = new Set(S.days[uid] || []);
  let d = set.has(dayKey(now())) ? 0 : 1, n = 0;
  while (set.has(dayKey(now() - (d + n) * DAY))) n++;
  return n;
}
function touch(uid) { const k = dayKey(now()); (S.days[uid] ||= []).includes(k) || S.days[uid].push(k); }
function lastActiveDays(uid) {
  const keys = new Set(S.days[uid] || []);
  for (let d = 0; d < 400; d++) if (keys.has(dayKey(now() - d * DAY))) return d;
  return 400;
}
function progressOf(uid, c) {
  const list = cs(uid, c);
  return { total: list.length, done: list.filter(x => x.st === 'done').length, review: list.filter(x => x.st === 'review').length, returned: list.filter(x => x.st === 'returned').length };
}
// Формула рейтинга: вес шага задаёт способ проверки; ручная проверка весит столько же, сколько задача с тестами.
function pointsOf(uid, c) {
  const r = { read: 0, auto: 0, cur: 0, nRead: 0, nAuto: 0, nCur: 0 };
  for (const x of cs(uid, c)) if (x.st === 'done') {
    const K = KINDS[x.step.task.kind];
    if (K.mode === 'read') { r.read += K.weight; r.nRead++; } else if (K.mode === 'auto') { r.auto += K.weight; r.nAuto++; } else { r.cur += K.weight; r.nCur++; }
  }
  r.streak = streakOf(uid); r.sPts = Math.min(r.streak, 10) * 3;
  r.total = r.read + r.auto + r.cur + r.sPts;
  return r;
}
function ranking(uid, c) {
  const g = groupFor(uid, c.id);
  const rows = (g ? g.students : [uid]).map(id => ({ uid: id, u: user(id), p: pointsOf(id, c) }))
    .sort((a, b) => b.p.total - a.p.total || a.u.name.localeCompare(b.u.name, 'ru'));
  const place = rows.findIndex(r => r.uid === uid) + 1;
  return { g, rows, place, me: rows[place - 1] };

function lastStepOf(uid) {
  let best = null;
  for (const a of S.atts) if (a.uid === uid && (!best || a.at > best.at)) best = { at: a.at, sid: a.sid };
  for (const w of S.subs) if (w.uid === uid && (!best || w.at > best.at)) best = { at: w.at, sid: w.sid };
  for (const [sid, at] of Object.entries(S.reads[uid] || {})) if (!best || at > best.at) best = { at, sid };

  return loc ? short(loc.step.title) : null;

// Отставание: три уровня. Сигналы «застрял» и «не исправил» видны раньше, чем ученик перестанет заходить.
function lagOf(uid) {
  const u = user(uid), d = lastActiveDays(uid), reasons = [];
  let lvl = 0;
  if (d >= 6) { lvl = 2; reasons.push(`не ${v(u, 'заходил', 'заходила')} ${d} ${plural(d, 'день', 'дня', 'дней')}`); }
  else if (d >= 3) { lvl = 1; reasons.push(`не ${v(u, 'заходил', 'заходила')} ${d} ${plural(d, 'день', 'дня', 'дней')}`); }
  for (const c of coursesOf(uid)) {
    const n = nextOf(uid, c);
    if (n) {
      const bad = attsOf(uid, n.step.id).filter(a => !a.ok).length;
      if (bad >= 3) { lvl = Math.max(lvl, 1); reasons.push(`${bad} ${plural(bad, 'неудачная попытка', 'неудачные попытки', 'неудачных попыток')} на шаге «${short(n.step.title)}»`); }
    }
    for (const x of cs(uid, c)) if (x.st === 'returned' && x.sub?.rat && now() - x.sub.rat >= 2 * DAY) {
      lvl = Math.max(lvl, 1); reasons.push(`работа «${short(x.step.title)}» возвращена ${daysText(daysAgo(x.sub.rat))} и ещё не исправлена`);

function parseBody(src) {
  const lines = String(src || '').replace(/\r/g, '').split('\n'), out = [];
  let para = [], list = null, i = 0;
  const flushP = () => { if (para.length) { out.push({ t: 'p', text: para.join(' ') }); para = []; } };
  const flushL = () => { if (list) { out.push({ t: 'ul', items: list }); list = null; } };
  while (i < lines.length) {
    const ln = lines[i], f = ln.match(/^:::(scratch|makecode|python)\s*$/);
    if (f) {
      flushP(); flushL();
      const body = []; i++;
      while (i < lines.length && lines[i].trim() !== ':::') body.push(lines[i++]);
      i++; out.push({ t: f[1], lines: body }); continue;
    }
    if (!ln.trim()) { flushP(); flushL(); i++; continue; }
    if (ln.startsWith('## ')) { flushP(); flushL(); out.push({ t: 'h', text: ln.slice(3) }); i++; continue; }
    if (ln.startsWith('> ')) { flushP(); flushL(); out.push({ t: 'note', text: ln.slice(2) }); i++; continue; }
    if (ln.startsWith('- ')) { flushP(); (list ||= []).push(ln.slice(2)); i++; continue; }
    flushL(); para.push(ln.trim()); i++;
  }
  flushP(); flushL();
  return out;
}
function scColor(t) {
  if (/^когда/.test(t)) return 'var(--blk-events)';
  if (/^(повторить|повторять|если|ждать|конец|иначе)/.test(t)) return 'var(--blk-control)';
  if (/^(говорить|думать|показаться|спрятаться)/.test(t)) return 'var(--blk-looks)';
  if (/^(стереть|опустить перо|поднять перо)/.test(t)) return 'var(--blk-pen)';
  if (/^(идти|повернуть|перейти|изменить [xy]|плыть|установить)/.test(t)) return 'var(--blk-motion)';
  if (/касается|нажата/.test(t)) return 'var(--blk-sensing)';
  if (/^изменить|^задать/.test(t)) return 'var(--blk-vars)';
  return 'var(--blk-other)';
}
const MC = { 'Игрок': 'var(--mc-player)', 'Агент': 'var(--mc-agent)', 'Циклы': 'var(--mc-loops)', 'Переменные': 'var(--mc-vars)' };
function renderProg(env, lines) {
  const stack = [];
  const rows = lines.filter(l => l.trim()).map(l => {
    const lvl = Math.floor(l.match(/^ */)[0].length / 4);
    let txt = l.trim(), cm = '', cat = '';
    const ci = txt.indexOf('←');
    if (ci >= 0) { cm = txt.slice(ci).trim(); txt = txt.slice(0, ci).trim(); }
    if (env === 'makecode') { const m = txt.match(/^\[(.+?)\]\s*/); if (m) { cat = m[1]; txt = txt.slice(m[0].length); } }
    const end = txt === 'конец';
    stack[lvl] = cat;
    const color = env === 'makecode' ? (MC[end ? (stack[lvl] || 'Циклы') : cat] || (end ? MC['Циклы'] : 'var(--blk-other)')) : scColor(txt);
    const inner = end ? 'конец' : esc(txt).replace(/\(([^)]*)\)/g, '<span class="slot">$1</span>').replace(/&lt;(.+?)&gt;/g, '<span class="slot hex">$1</span>');
    return `<div class="blk-row" style="margin-left:${lvl * 28}px"><div class="blk${end ? ' end' : ''}" style="--c:${color}">${cat && !end ? `<span class="cat">${esc(cat)}</span>` : ''}${inner}</div>${cm ? `<span class="blk-cm">${esc(cm)}</span>` : ''}</div>`;
  });
  return `<div class="prog" role="figure" aria-label="${env === 'scratch' ? 'Программа Scratch' : 'Программа MakeCode'}"><div class="prog-h">${env === 'scratch' ? 'Программа Scratch' : 'Программа MakeCode'}</div>${rows.join('')}</div>`;
}
function hlPy(src) {
  const re = /(#[^\n]*)|("(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*')|\b(\d+(?:\.\d+)?)\b|\b(if|elif|else|for|while|in|and|or|not|def|return|True|False|None|import|from|break|continue)\b|\b(print|input|int|map|range|len|str|max|min|sum|round|list|abs)\b/g;
  let out = '', last = 0, m;
  while ((m = re.exec(src))) {
    out += esc(src.slice(last, m.index));
    out += `<span class="${m[1] ? 'tc' : m[2] ? 'ts' : m[3] ? 'tn' : m[4] ? 'tk' : 'tb2'}">${esc(m[0])}</span>`;
    last = re.lastIndex;
  }
  return out + esc(src.slice(last));
}
function renderBody(src) {
  return parseBody(src).map(b => {
    if (b.t === 'p') return `<p>${inl(b.text)}</p>`;
    if (b.t === 'h') return `<h2>${inl(b.text)}</h2>`;
    if (b.t === 'ul') return `<ul>${b.items.map(x => `<li>${inl(x)}</li>`).join('')}</ul>`;
    if (b.t === 'note') return `<div class="note">${inl(b.text)}</div>`;
    if (b.t === 'python') return `<pre class="code">${hlPy(b.lines.join('\n'))}</pre>`;
    return renderProg(b.t, b.lines);
  }).join('');
}

function shot(kind) {

  for (let x = 0; x < W; x += s) for (let y = 0; y < H; y += s) if ((x * 7 + y * 13) % 5 === 0) r += `<rect x="${x}" y="${y}" width="${s}" height="${s}" fill="#6FA447"/>`;
  const b = (x, y, f, e) => { r += `<rect x="${x}" y="${y}" width="${s}" height="${s}" fill="${f}"/><rect x="${x + .5}" y="${y + .5}" width="${s - 1}" height="${s - 1}" fill="none" stroke="${e}"/>`; };
  if (kind === 'path') for (let i = 0; i < 10; i++) b(80 + i * s, 96, '#9A9A9A', '#737373');
  if (kind === 'wall' || kind === 'wallshift') for (let row = 0; row < 3; row++) for (let i = 0; i < 5; i++) b(120 + i * s + (kind === 'wallshift' && row > 0 ? s : 0), 112 - row * s, '#B5553C', '#86392A');

  }
  r += `<rect x="${W - 92}" y="${H - 24}" width="84" height="16" rx="3" fill="rgba(0,0,0,.45)"/><text x="${W - 50}" y="${H - 12.5}" font-family="Arial" font-size="10" fill="#fff" text-anchor="middle">демо-скриншот</text>`;
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">${r}</svg>`);
}

function sCourse() {

    </section>

function sRating() {

function sWorks() {

function sQuestions() {

/* ===== Страница шага ===== */
function sStep() {
  const c = course(S.route.cid), uid = S.uid;
  const list = c ? cs(uid, c) : [], x = list.find(i => i.step.id === S.route.sid);
  if (!x) return `<div class="card pad stack"><p>Этот шаг убрали из курса.</p><div><button class="btn btn-secondary" data-act="go" data-r="home">На главную</button></div></div>`;
  const p = progressOf(uid, c), pct = Math.round(p.done / p.total * 100), n = nextOf(uid, c);
  const modItems = list.filter(i => i.mi === x.mi);
  const main = x.st === 'idle'
    ? `<section class="card locked"><span class="tb">${icon('lock')}</span><h2 class="ctitle">Шаг пока закрыт</h2>
        <p class="muted">Он откроется, когда ты пройдёшь предыдущие шаги курса.${n ? ` Сейчас твой шаг — «${esc(short(n.step.title))}».` : ''}</p>
        ${n ? `<button class="btn btn-primary" data-act="open" data-cid="${c.id}" data-sid="${n.step.id}">К текущему шагу ${icon('arrowR')}</button>` : ''}</section>`
    : `<div class="body">${renderBody(x.step.body)}</div>${taskHtml(c, x, uid, false)}${navRow(c, list, x)}${qBox(c, x, uid)}${histHtml(uid, x)}`;
  return `<nav class="crumbs" aria-label="Навигация"><button data-act="go" data-r="course" data-cid="${c.id}">${icon('arrowL', 'sm')} ${esc(c.data.title)}</button><span aria-hidden="true">·</span><span>Модуль ${modCode(c, x.mi)}. ${esc(x.mod.title)}</span></nav>
  <div class="steplay"><div class="stack-lg">${stepHead(c, x, list.length)}${main}</div>
  <aside class="side">
    <section class="card mini"><h3>Модуль ${modCode(c, x.mi)}. ${esc(x.mod.title)}</h3><ul class="mlist">${modItems.map(i => `<li><button data-act="open" data-cid="${c.id}" data-sid="${i.step.id}"${i.step.id === x.step.id ? ' aria-current="step"' : ''}><span class="sdot st-${i.st}">${icon(ST[i.st][1])}</span><span>${esc(short(i.step.title))}</span></button></li>`).join('')}</ul></section>
    <section class="card mini"><div class="row between"><b>Весь курс</b><span class="faint num" style="font-size:15px">${p.done} из ${p.total}</span></div><div class="bar" aria-hidden="true"><i style="width:${pct}%"></i></div>
      <button class="linkbtn" style="justify-self:start;font-size:15px" data-act="go" data-r="course" data-cid="${c.id}">Карта курса →</button></section>
  </aside></div>`;
}
function stepHead(c, x, total) {
  const s = x.step, t = s.task;
  return `<header class="shead">
    <div class="row" style="gap:12px">${tb(s.type)}<span class="muted" style="font-weight:600">${esc(typeOf(s.type).name)}</span>${pillBy(x)}</div>
    <h1>${esc(s.title)}</h1>
    <div class="passline"><span>Шаг <b class="num">${x.idx + 1} из ${total}</b></span><span>Проверка: <b>${esc(checkOf(s))}</b></span><span>Сдаёшь: <b>${esc(givesOf(s))}</b></span>${t.kind === 'code' ? `<span>Ограничения: <b>${t.limits.t} с, ${t.limits.m} МБ</b></span>` : ''}</div>
  </header>`;
}
function navRow(c, list, x) {
  const prev = list[x.idx - 1], next = list[x.idx + 1];
  const right = !next ? `<button class="btn btn-secondary" data-act="go" data-r="course" data-cid="${c.id}">К карте курса</button>`
    : next.st === 'idle' ? `<button class="btn" disabled>${icon('lock', 'md')} Следующий шаг закрыт</button>`
    : `<button class="btn btn-secondary" data-act="open" data-cid="${c.id}" data-sid="${next.step.id}">Следующий шаг ${icon('arrowR')}</button>`;
  return `<div class="navrow">${prev ? `<button class="btn btn-ghost" data-act="open" data-cid="${c.id}" data-sid="${prev.step.id}">${icon('arrowL')} Назад</button>` : '<span></span>'}${right}</div>`;
}
function nextBtn(c, x, uid) {
  const list = uid ? cs(uid, c) : [], next = list[x.idx + 1];
  return next && next.st !== 'idle'
    ? `<button class="btn btn-primary btn-lg" data-act="open" data-cid="${c.id}" data-sid="${next.step.id}">Следующий шаг ${icon('arrowR')}</button>`
    : `<button class="btn btn-secondary btn-lg" data-act="go" data-r="course" data-cid="${c.id}">К карте курса</button>`;
}
const taskHtml = (c, x, uid, pv) => ({ read: tRead, choice: tChoice, number: tNumber, code: tCode, manual: tManual })[x.step.task.kind]?.(c, x, uid, pv) || '';
const fbBox = f => f ? `<div class="fb fb-${f.cls}" role="${f.cls === 'ok' ? 'status' : 'alert'}">${f.html}</div>` : '';

function tRead(c, x, uid, pv) {
  const done = x.st === 'done';
  return `<section class="card task">${done ? `<div class="fb fb-ok"><b>Прочитано. Шаг зачтён.</b></div>` : ''}
    <div class="row"><button class="btn btn-primary btn-lg" data-act="${pv ? 'noop' : 'read'}" data-cid="${c.id}" data-sid="${x.step.id}">${done ? 'Следующий шаг' : 'Прочитано, дальше'} ${icon('arrowR')}</button></div></section>`;
}
function tChoice(c, x, uid, pv) {
  const t = x.step.task, sid = x.step.id, done = x.st === 'done';
  const sel = done ? t.options.map((o, i) => o.ok ? i : -1).filter(i => i >= 0) : (pv ? [] : S.ui.sel[sid] || []);
  const opts = t.options.map((o, i) => {
    const on = sel.includes(i);
    return `<button class="opt${t.multi ? ' multi' : ''}${done && o.ok ? ' ok' : ''}" role="${t.multi ? 'checkbox' : 'radio'}" aria-checked="${on}" data-act="${pv ? 'noop' : 'pick'}" data-sid="${sid}" data-i="${i}"${done ? ' disabled' : ''}><span class="mk2">${on ? icon('check', 'sm') : ''}</span><span>${esc(o.t)}</span></button>`;
  }).join('');
  const f = pv ? null : S.ui.fb[sid] || (done ? { cls: 'ok', html: '<b>Верно. Шаг зачтён.</b>' } : null);
  return `<section class="card task" aria-label="Ответ"><div class="eyebrow">${t.multi ? 'Выбери все верные варианты' : 'Выбери один вариант'}</div>
    <div class="opts" role="${t.multi ? 'group' : 'radiogroup'}">${opts}</div>${fbBox(f)}
    <div class="row">${done ? nextBtn(c, x, uid) : `<button class="btn btn-primary btn-lg" data-act="${pv ? 'noop' : 'answer'}" data-sid="${sid}"${sel.length ? '' : ' disabled'}>Проверить</button>`}</div></section>`;
}
function tNumber(c, x, uid, pv) {
  const t = x.step.task, sid = x.step.id, done = x.st === 'done';
  const val = done ? t.answer : (pv ? '' : S.ui.num[sid] ?? '');
  const f = pv ? null : S.ui.fb[sid] || (done ? { cls: 'ok', html: `<b>Верно, ответ ${esc(t.answer)}. Шаг зачтён.</b>` } : null);
  return `<section class="card task" aria-label="Ответ"><label class="field" for="num-${sid}"><span>Твой ответ — одно число</span>
    <input class="inp num" id="num-${sid}" inputmode="decimal" autocomplete="off" data-bind="num" data-sid="${sid}" value="${esc(val)}" placeholder="Например, 25"${done || pv ? ' disabled' : ''} style="max-width:280px"></label>
    ${fbBox(f)}<div class="row">${done ? nextBtn(c, x, uid) : `<button class="btn btn-primary btn-lg" data-act="${pv ? 'noop' : 'answer'}" data-sid="${sid}">Проверить</button>`}</div></section>`;
}
function chips(v, tests) {
  const word = r => r === 1 ? 'пройден' : r === 0 ? 'неверный ответ' : r === 't' ? 'превышено время' : r === 'r' ? 'ошибка выполнения' : r === 'run' ? 'проверяется' : 'ждёт';
  return `<div class="tests" aria-label="Результаты по тестам">${v.map((r, i) => {
    const cls = r === 1 ? 'ok' : r === 'run' ? 'run' : r == null ? '' : 'bad';
    const ic = r === 1 ? 'check' : r === 't' ? 'clock' : r === 0 || r === 'r' ? 'x' : '';
    return `<span class="tchip ${cls}" title="Тест ${i + 1}${tests[i]?.[2] ? ' из примера' : ', скрытый'}: ${word(r)}">${i + 1}${ic ? `<i>${icon(ic)}</i>` : ''}</span>`;
  }).join('')}</div>`;
}
function failDetail(t, att) {
  const i = att.v.findIndex(r => r !== 1), r = att.v[i], test = t.tests[i] || ['', '', 0], d = att.detail?.i === i ? att.detail : null;
  if (r === 't') return `<p>Тест ${i + 1}${test[2] ? '' : ' скрытый'}: программа не уложилась во время. Посмотри на ограничения: сколько повторений сделает твой цикл при самом большом входе?</p>`;
  if (r === 'r' && /^(SyntaxError|IndentationError)/.test(d?.err || '')) return `<p>В коде есть синтаксическая ошибка: <code class="mono">${esc(d.err)}</code>. Проверь скобки, двоеточия и отступы.</p>`;
  if (r === 'r') return `<p>Тест ${i + 1}: программа завершилась с ошибкой${d?.err ? ` <code class="mono">${esc(d.err)}</code>` : ''}. Проверь, как читаются входные данные.</p>`;
  if (test[2]) return `<p>Посмотри на тест ${i + 1} из примера.</p><div style="overflow-x:auto"><table class="stbl" style="background:#fff;border-radius:10px"><thead><tr><th>Ввод</th><th>Нужно</th>${d ? '<th>Вывела программа</th>' : ''}</tr></thead><tbody><tr><td>${esc(test[0])}</td><td>${esc(test[1])}</td>${d ? `<td>${esc(d.got || '(пусто)')}</td>` : ''}</tr></tbody></table></div>`;
  return `<p>Тест ${i + 1} скрытый, поэтому входных данных не видно. Проверь крайние случаи из ограничений: самые маленькие и самые большие значения.</p>`;
}
function tCode(c, x, uid, pv) {
  const t = x.step.task, sid = x.step.id, done = x.st === 'done';
  const code = pv ? '' : S.drafts[uid + '|' + sid] ?? '';
  const run = pv ? null : S.ui.run[sid];
  const atts = uid ? attsOf(uid, sid) : [], last = atts[atts.length - 1];
  let res = '';
  if (run) res = `<div class="stack" style="gap:10px" aria-live="polite">${chips(run.v, t.tests)}<p class="muted" style="font-size:16px">${run.msg}</p></div>`;
  else if (last) {
    const pass = last.v.filter(r => r === 1).length, n = last.v.length;
    res = last.ok
      ? `<div class="fb fb-ok" role="status">${chips(last.v, t.tests)}<b>Все ${n} ${plural(n, 'тест пройден', 'теста пройдены', 'тестов пройдены')}. Шаг зачтён.</b></div>`
      : `<div class="fb fb-fail" role="alert">${chips(last.v, t.tests)}<b>Прошло ${pass} ${plural(pass, 'тест', 'теста', 'тестов')} из ${n}.</b>${failDetail(t, last)}</div>`;
  }
  const failed = !done && last && !last.ok;
  const samples = t.tests.filter(s => s[2]);
  const btn = run ? `<button class="btn btn-primary btn-lg" disabled>Проверяю…</button>`
    : done ? `<button class="btn btn-secondary btn-lg" data-act="${pv ? 'noop' : 'run'}" data-sid="${sid}">Отправить ещё раз</button>${nextBtn(c, x, uid)}`
    : `<button class="btn btn-primary btn-lg" data-act="${pv ? 'noop' : 'run'}" data-sid="${sid}">${failed ? 'Отправить снова' : 'Отправить решение'}</button>`;
  return `<section class="card task" aria-label="Решение">
    ${samples.length ? `<div class="samples"><div class="eyebrow">${samples.length > 1 ? 'Примеры' : 'Пример'}</div><div style="overflow-x:auto"><table class="stbl"><thead><tr><th>Входные данные</th><th>Выходные данные</th></tr></thead><tbody>${samples.map(s => `<tr><td>${esc(s[0])}</td><td>${esc(s[1])}</td></tr>`).join('')}</tbody></table></div></div>` : ''}
    <label class="field" for="ed-${sid}"><span>Решение на Python 3</span>
      <textarea class="editor" id="ed-${sid}" data-bind="code" data-sid="${sid}" spellcheck="false" autocapitalize="off" autocomplete="off" placeholder="# напиши решение здесь"${pv ? ' disabled' : ''}>${esc(code)}</textarea></label>
    ${pv ? '' : fbBox(S.ui.fb[sid])}${res}
    <div class="row">${btn}</div>
    <p class="faint" style="font-size:15px">Код проверяется прямо в браузере на ${t.tests.length} ${plural(t.tests.length, 'тесте', 'тестах', 'тестах')}. Интерпретатор здесь медленнее обычного Python, поэтому лимит времени в прототипе увеличен в ${PY_FACTOR} ${plural(PY_FACTOR, 'раз', 'раза', 'раз')}.</p>
  </section>`;
}

function cQuestions() {

        : `<label class="field" for="qa-${q.id}"><span>Ответ</span><textarea class="ta" id="qa-${q.id}" data-bind="qa" data-id="${q.id}" placeholder="Ученик увидит ответ на странице этого шага.">${esc(d)}</textarea></label>

/* ===== Администратор ===== */

function checkEditor(s) {

      ${t.tests.map((r, i) => `<tr><td class="num">${i + 1}</td><td><textarea class="ta" aria-label="Ввод теста ${i + 1}" data-bind="btest" data-i="${i}" data-j="0">${esc(r[0])}</textarea></td><td><textarea class="ta" aria-label="Ответ теста ${i + 1}" data-bind="btest" data-i="${i}" data-j="1">${esc(r[1])}</textarea></td>

function aTypes() {

/* ===== Проверка Python =====
   Код выполняет Skulpt в фоновом потоке (Web Worker). Лимит времени честный: поток останавливается,
   как только время вышло, поэтому бесконечный цикл не подвешивает страницу.
   Если браузер не даёт создать поток, код выполняется на странице с таймером Skulpt (медленнее). */
const PY_FACTOR = 2;
const SK_SRC = ['https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt.min.js', 'https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt-stdlib.js'];
const WORKER_SRC = `self.onmessage = function (e) {
  var d = e.data;
  if (d.init) { try { importScripts.apply(null, d.init); postMessage({ ready: true }); } catch (err) { postMessage({ loadErr: String(err) }); } return; }
  var lines = String(d.input).replace(/\\r/g, '').split('\\n'), out = '';
  Sk.configure({
    output: function (t) { out += t; if (out.length > 1e6) throw new Sk.builtin.RuntimeError('слишком большой вывод'); },
    read: function (f) { if (Sk.builtinFiles.files[f] === undefined) throw "File not found: '" + f + "'"; return Sk.builtinFiles.files[f]; },
    inputfun: function () { return lines.length ? lines.shift() : ''; }, inputfunTakesPrompt: true,
    __future__: Sk.python3, execLimit: null, yieldLimit: null
  });
  var t0 = performance.now();
  try { Sk.importMainWithBody('<stdin>', false, d.code, false); postMessage({ out: out, ms: performance.now() - t0 }); }
  catch (err) { postMessage({ err: String(err && err.toString ? err.toString() : err), out: out, ms: performance.now() - t0 }); }

function ensureWorker() {

  catch (e) { return Promise.reject(e); }
  wk = { w };
  wk.ready = new Promise((res, rej) => {
    w.onmessage = e => e.data.ready ? res(w) : rej(new Error(e.data.loadErr || 'skulpt'));
    w.onerror = e => { e.preventDefault?.(); rej(new Error('worker')); };
    w.postMessage({ init: SK_SRC });
  }).catch(err => { w.terminate(); wk = null; throw err; });
  return wk.ready;
}
function loadSkMain() {

  return skP ||= new Promise((res, rej) => {
    const add = i => {
      if (i >= SK_SRC.length) return window.Sk && Sk.builtinFiles ? res() : rej(new Error('skulpt'));
      const s = document.createElement('script');
      s.src = SK_SRC[i]; s.onload = () => add(i + 1); s.onerror = () => { skP = null; rej(new Error('skulpt')); };

}
const fmtErr = msg => String(msg).replace(/ on line (\d+)/, ', строка $1').split('\n')[0];
async function runPy(code, input, limitMs) {
  if (!noWorker) {

      const w = await ensureWorker();
      return await new Promise(resolve => {
        let fin = false;
        const stop = r => { if (fin) return; fin = true; clearTimeout(timer); resolve(r); };
        const timer = setTimeout(() => { w.terminate(); wk = null; stop({ tl: true, ms: limitMs }); }, limitMs);
        w.onmessage = e => { const d = e.data; stop(d.err ? { err: fmtErr(d.err), out: d.out, ms: d.ms } : { out: d.out, ms: d.ms }); };
        w.onerror = e => { e.preventDefault?.(); w.terminate(); wk = null; stop({ err: 'ошибка выполнения', ms: 0 }); };

async function runPyMain(code, input, limitMs) {
  await loadSkMain();

  let out = '';

    output: t => { out += t; if (out.length > 2e5) throw new Sk.builtin.RuntimeError('слишком большой вывод'); },

  for (let i = 0; i < t.tests.length; i++) {
    v[i] = 'run'; onTick(v, i);
    const r = await runPy(code, t.tests[i][0], t.limits.t * 1000 * PY_FACTOR);
    if (r.tl) v[i] = 't';
    else if (r.err) { v[i] = 'r'; detail ||= { i, err: r.err }; }
    else { v[i] = tokens(r.out) === tokens(t.tests[i][1]) ? 1 : 0; if (!v[i]) detail ||= { i, got: r.out.trim().slice(0, 300) }; }
  }
  onTick(v, -1);
  return { v, detail };
}

function actAnswer(sid) {

    const ok = sel.length === right.length && sel.every((x, i) => x === right[i]);

  const [s] = steps.splice(si, 1);
  if (d < 0) { if (si > 0) steps.splice(si - 1, 0, s); else D.modules[mi - 1].steps.push(s); }
  else if (si < steps.length) steps.splice(si + 1, 0, s); else D.modules[mi + 1].steps.unshift(s);
}

const DEFAULT_USER = { student: 'u-masha', curator: 'c-olga', admin: 'a-elena' };
function go(route) {
  S.route = route; S.ui.badd = null; S.ui.bdel = null; S.ui.bmoddel = null;
  render(); window.scrollTo(0, 0);
}
const ACT = {
  enter: d => { const u = user(d.uid); S.role = u.role; S.uid = u.id; go({ ...HOME[u.role] }); },
  role: d => { if (S.role === d.role) return; S.role = d.role; S.uid = DEFAULT_USER[d.role]; go({ ...HOME[d.role] }); },
  logout: () => { S.role = null; go({ r: 'login' }); },
  reset: () => {
    const { role, uid } = S;
    clearSavedState();
    buildState();
    S.role = role;
    S.uid = uid;
    saveStateNow();
    go(role ? { ...HOME[role] } : { r: 'login' });
    toast('Демонстрационные данные восстановлены.');
  },
  go: d => go({ r: d.r, cid: d.cid, sid: d.sid, id: d.id, uid: d.uid }),
  open: d => { S.ui.fb[d.sid] = null; go({ r: 'step', cid: d.cid, sid: d.sid }); },
  noop: () => {},
  read: d => actRead(d.cid, d.sid),
  pick: d => {
    const sid = d.sid, i = +d.i, t = locate(sid).step.task, sel = S.ui.sel[sid] || [];
    S.ui.sel[sid] = t.multi ? (sel.includes(i) ? sel.filter(x => x !== i) : [...sel, i]) : [i];
    S.ui.fb[sid] = null; render();
  },
  answer: d => actAnswer(d.sid),
  run: d => actRun(d.sid),
  submit: d => actSubmit(d.sid),
  qopen: d => { S.ui.qd[d.sid] = { open: true, text: '' }; render(); document.getElementById('qd-' + d.sid)?.focus(); },
  qcancel: d => { S.ui.qd[d.sid] = null; render(); },
  qsend: d => {
    const q = S.ui.qd[d.sid], text = (q?.text || '').trim();
    if (text.length < 3) { q.err = 'Напиши вопрос: пару слов о том, что непонятно.'; render(); return; }
    S.qs.push({ id: nid('q'), uid: S.uid, sid: d.sid, cid: d.cid, at: now(), text, ans: null, seen: true });
    S.ui.qd[d.sid] = null; touch(S.uid); render();
    toast('Вопрос отправлен. Ответ появится на странице шага и во вкладке «Вопросы».');
  },
  qf: d => { S.ui.qf = d.f; render(); },
  sf: d => { S.ui.sf = d.f; render(); },
  accept: d => actDecide(d.id, true),
  return: d => actDecide(d.id, false),
  qanswer: d => {
    const q = S.qs.find(x => x.id === d.id), text = (S.ui.qa?.[d.id] || '').trim();
    if (text.length < 3) { S.ui.fb['qa' + d.id] = { err: 'Напишите ответ: ученик увидит его на странице шага.' }; render(); return; }
    q.ans = { by: S.uid, at: now(), text }; q.seen = false; S.ui.fb['qa' + d.id] = null;
    render(); toast(`Ответ отправлен. ${user(q.uid).name} увидит его на странице шага.`);
  },
  // конструктор курса
  newcourse: () => {
    const c = { id: nid('c'), status: 'draft', version: 0, draft: null, log: [],
      data: { title: 'Новый курс', short: 'Новый курс', grades: '', volume: '', tool: '', goal: '', modules: [{ id: nid('m'), title: 'Первый модуль', steps: [] }] } };
    S.courses.push(c); go({ r: 'builder', cid: c.id, sid: '__passport' });
  },
  bsel: d => { S.route.sid = d.sid; S.ui.bdel = null; S.ui.badd = null; render(); },
  btab: d => { S.ui.btab = d.t; render(); },
  badd: d => { S.ui.badd = d.mi === '-1' ? null : +d.mi; render(); },
  baddtype: d => {
    const D = editable(course(S.route.cid)), T = typeOf(d.type), k = d.kind;
    const step = { id: nid('s'), type: T.id, title: `Новый шаг: ${T.name.toLowerCase()}`, body: DEFAULT_BODY[k], task: defaultTask(k, T) };
    D.modules[+d.mi].steps.push(step);
    S.route.sid = step.id; S.ui.badd = null; S.ui.btab = 'content'; render();
  },
  bmove: d => { moveStep(editable(course(S.route.cid)), d.sid, +d.d); render(); },
  bdel: d => { S.ui.bdel = d.sid || null; render(); },
  bdelok: d => {
    const D = editable(course(S.route.cid));
    D.modules.forEach(m => { m.steps = m.steps.filter(s => s.id !== d.sid); });
    S.route.sid = '__passport'; S.ui.bdel = null; render(); toast('Шаг удалён из черновика курса.');
  },
  bmodadd: () => { editable(course(S.route.cid)).modules.push({ id: nid('m'), title: 'Новый модуль', steps: [] }); render(); },
  bmodmove: d => { const M = editable(course(S.route.cid)).modules, i = +d.mi, j = i + +d.d; [M[i], M[j]] = [M[j], M[i]]; render(); },
  bmoddel: d => { S.ui.bmoddel = +d.mi >= 0 ? +d.mi : null; render(); },
  bmoddelok: d => { const D = editable(course(S.route.cid)); D.modules.splice(+d.mi, 1); S.ui.bmoddel = null; render(); },
  boptadd: () => { stepSel().task.options.push({ t: 'Новый вариант', ok: false }); render(); },
  boptdel: d => { stepSel().task.options.splice(+d.i, 1); render(); },
  btestadd: () => { stepSel().task.tests.push(['', '', 0]); render(); },
  btestdel: d => { stepSel().task.tests.splice(+d.i, 1); render(); },
  bcheckref: async () => {
    const s = stepView(), t = s.task;
    (S.ui.refres ||= {})[s.id] = { running: true, v: t.tests.map(() => null) }; render();
    try { await loadSk(); } catch (e) { S.ui.refres[s.id] = null; render(); toast('Не получилось загрузить интерпретатор Python.'); return; }
    const r = await runTests(t, t.ref || '', v => { S.ui.refres[s.id] = { running: true, v: [...v] }; if (S.route.r === 'builder') render(); });
    S.ui.refres[s.id] = { running: false, v: r.v }; render();
  },
  publish: d => {
    const c = course(d.cid);
    if (!flat(view(c)).length) { toast('В курсе нет ни одного шага. Добавьте шаг, чтобы опубликовать курс.'); return; }
    if (c.status === 'draft') { c.status = 'published'; c.version = 1; c.log.unshift({ v: 1, at: now(), by: S.uid, note: 'Первая публикация' }); }
    else if (c.draft) { c.data = c.draft; c.draft = null; c.version++; c.log.unshift({ v: c.version, at: now(), by: S.uid, note: 'Изменения опубликованы' }); }
    render(); toast(`Курс опубликован, версия ${c.version}. Ученики групп уже видят изменения.`);
  },
  discard: d => {
    const c = course(d.cid); c.draft = null;
    if (!flat(c.data).some(x => x.step.id === S.route.sid)) S.route.sid = '__passport';
    render(); toast('Изменения отменены. Курс совпадает с опубликованной версией.');
  },
  // типы шагов
  nticon: d => { S.ui.nt.icon = d.i; render(); },
  ntadd: () => {
    const nt = S.ui.nt, name = nt.name.trim();
    if (!name) { S.ui.fb.nt = { err: 'Введите название типа.' }; render(); return; }
    if (S.types.some(t => t.name.toLowerCase() === name.toLowerCase())) { S.ui.fb.nt = { err: 'Тип с таким названием уже есть.' }; render(); return; }
    if (nt.kind === 'manual' && !nt.fields.length) { S.ui.fb.nt = { err: 'Отметьте, что сдаёт ученик: ссылку, скриншот, текст или файл.' }; render(); return; }
    S.types.push({ id: nid('t'), name, icon: nt.icon, kinds: [nt.kind], fields: nt.kind === 'manual' ? [...nt.fields] : undefined, desc: nt.desc.trim() || `${KINDS[nt.kind].name}.`, builtin: false });
    S.ui.nt = null; S.ui.fb.nt = null; render();
    toast(`Тип «${name}» добавлен. Он уже есть в меню «Шаг» конструктора курса.`);
  },
  // группы и люди
  gadd: () => {
    const c = S.courses.find(x => x.status === 'published');
    S.groups.push({ id: nid('g'), name: 'Новая группа', courseId: c.id, curatorId: S.users.find(u => u.role === 'curator').id, students: [] }); render();
  },
  gdel: d => { const g = S.groups.find(x => x.id === d.id); g.students = g.students.filter(s => s !== d.uid); render(); },
  gaddst: d => {
    const id = S.ui.gpick?.[d.id], g = S.groups.find(x => x.id === d.id);
    if (id && !g.students.includes(id)) { g.students.push(id); S.days[id] ||= []; S.ui.gpick[d.id] = ''; render(); toast(`${user(id).name} в группе «${g.name}».`); }
  },
  padd: () => {
    const np = S.ui.np, name = np.name.trim();
    if (name.length < 2) { S.ui.fb.np = { err: 'Введите имя.' }; render(); return; }
    const u = { id: nid('u'), role: np.role, name, grade: np.role === 'student' ? +np.grade : undefined, g: '?' };
    S.users.push(u); S.days[u.id] = []; S.ui.np = null; S.ui.fb.np = null; render();
    toast(np.role === 'student' ? `${name} добавлен(а). Теперь можно включить ученика в группу.` : `${name} добавлен(а). Назначьте куратора группе.`);
  },
};

/* ===== Привязка полей ===== */
const tog = (arr, x, on) => on ? (arr.includes(x) ? arr : [...arr, x]) : arr.filter(y => y !== x);
const BIND = {
  who: el => { S.uid = el.value; S.route = { ...HOME[S.role] }; },
  num: el => { S.ui.num[el.dataset.sid] = el.value; },
  code: el => { S.drafts[S.uid + '|' + el.dataset.sid] = el.value; },
  man: el => { (S.ui.man[el.dataset.sid] ||= {})[el.dataset.f] = el.value; },
  manfile: el => { const f = el.files?.[0]; if (f) takeFile(el.dataset.sid, el.dataset.f, f); },
  qd: el => { (S.ui.qd[el.dataset.sid] ||= { open: true }).text = el.value; },
  cmt: el => { S.ui.cmt[el.dataset.id] = el.value; },
  qa: el => { (S.ui.qa ||= {})[el.dataset.id] = el.value; },
  crit: el => { S.ui.crit[el.dataset.id] = tog(S.ui.crit[el.dataset.id] || [], +el.dataset.i, el.checked); },
  bstep: el => { stepSel().title = el.value; const t = document.querySelector('.tstep[aria-current="true"] .t'); if (t) t.textContent = el.value; },
  bbody: el => { stepSel().body = el.value; const p = document.getElementById('bprev'); if (p) p.innerHTML = renderBody(el.value); },
  bpass: el => { editable(course(S.route.cid))[el.dataset.k] = el.value; },
  bmod: el => { editable(course(S.route.cid)).modules[+el.dataset.mi].title = el.value; },
  btask: el => { stepSel().task[el.dataset.k] = el.value; },
  blimit: el => { stepSel().task.limits[el.dataset.k] = Math.max(1, +el.value || 1); },
  btest: el => { stepSel().task.tests[+el.dataset.i][+el.dataset.j] = el.value; },
  bsample: el => { stepSel().task.tests[+el.dataset.i][2] = el.checked ? 1 : 0; },
  bref: el => { stepSel().task.ref = el.value; },
  bmulti: el => { stepSel().task.multi = el.checked; },
  bopt: el => { stepSel().task.options[+el.dataset.i].t = el.value; },
  boptok: el => { const t = stepSel().task; if (!t.multi && el.checked) t.options.forEach(o => { o.ok = false; }); t.options[+el.dataset.i].ok = el.checked; },
  bfield: el => { const t = stepSel().task; t.fields = tog(t.fields || [], el.dataset.f, el.checked); delete t.gives; },
  blabel: el => { const t = stepSel().task; (t.labels ||= {})[el.dataset.f] = el.value; delete t.gives; },
  bcrit: el => { stepSel().task.criteria = el.value.split('\n').map(s => s.trim()).filter(Boolean); },
  nt: el => { S.ui.nt[el.dataset.k] = el.value; },
  ntf: el => { S.ui.nt.fields = tog(S.ui.nt.fields, el.dataset.f, el.checked); },
  np: el => { S.ui.np[el.dataset.k] = el.value; },
  gname: el => { S.groups.find(g => g.id === el.dataset.id).name = el.value; },
  gcourse: el => { S.groups.find(g => g.id === el.dataset.id).courseId = el.value; },
  gcur: el => { S.groups.find(g => g.id === el.dataset.id).curatorId = el.value; },
  gpick: el => { (S.ui.gpick ||= {})[el.dataset.id] = el.value; },
};
function onBind(e) {
  const el = e.target, b = el.dataset?.bind;
  if (!b || !BIND[b]) return;
  const discrete = el.tagName === 'SELECT' || el.type === 'checkbox' || el.type === 'file';
  if ((e.type === 'change') !== discrete) return;
  BIND[b](el);
  if (discrete && b !== 'manfile' && b !== 'crit' && b !== 'gpick') render();
}
function render() {
  saveState();
  memo = new Map();
  const app = document.getElementById('app'), a = document.activeElement, id = a?.id;
  let s0 = null, s1 = null;
  try { s0 = a.selectionStart; s1 = a.selectionEnd; } catch (e) { /* не текстовое поле */ }
  if (!S.role) { app.className = ''; app.innerHTML = viewLogin(); }
  else { app.className = S.role === 'student' ? 'role-student' : 'role-staff'; app.innerHTML = demoBar() + (S.role === 'student' ? studentShell() : staffShell()); }
  if (id) { const el = document.getElementById(id); if (el) { el.focus({ preventScroll: true }); if (s0 != null) try { el.setSelectionRange(s0, s1); } catch (e) { /* поле без выделения */ } } }
}
function insertText(el, s) { el.setRangeText(s, el.selectionStart, el.selectionEnd, 'end'); el.dispatchEvent(new Event('input', { bubbles: true })); }

/* ===== Запуск ===== */
if (!loadSavedState()) {
  buildState();
  saveStateNow();
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const f = ACT[el.dataset.act];
  if (!f) return;
  e.preventDefault(); f(el.dataset, el, e);
});
document.addEventListener('input', onBind);
document.addEventListener('change', onBind);
document.addEventListener('keydown', e => {
  const el = e.target;
  if (el.classList?.contains('editor') && !el.disabled && el.dataset.bind) {
    if (e.key === 'Escape') { el.blur(); return; }
    if (e.key === 'Tab' && !e.shiftKey) { e.preventDefault(); insertText(el, '    '); return; }
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); el.closest('.task')?.querySelector('[data-act="run"]')?.click(); return; }
    if (e.key === 'Enter') {
      const line = el.value.slice(0, el.selectionStart).split('\n').pop();
      let ind = line.match(/^ */)[0];
      if (/:\s*$/.test(line)) ind += '    ';
      if (ind) { e.preventDefault(); insertText(el, '\n' + ind); }
    }
    return;
  }
  if (e.key === 'Enter' && el.dataset?.bind === 'num') { e.preventDefault(); actAnswer(el.dataset.sid); return; }
  if ((e.key === 'Enter' || e.key === ' ') && el.getAttribute?.('role') === 'button' && el.dataset?.act) { e.preventDefault(); el.click(); }
});
document.addEventListener('dragover', e => { const z = e.target.closest?.('.upl'); if (z) { e.preventDefault(); z.classList.add('drag'); } });
document.addEventListener('dragleave', e => { const z = e.target.closest?.('.upl'); if (z) z.classList.remove('drag'); });
document.addEventListener('drop', e => {
  const z = e.target.closest?.('.upl');
  if (!z) return;
  e.preventDefault(); z.classList.remove('drag');
  const f = e.dataTransfer?.files?.[0];
  if (f) takeFile(z.dataset.drop, z.dataset.f, f);
});
render();

</script>
